<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panier - Couturo Business</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2"><img src="images/logo.jpg" alt="Couturo Business" class="h-12"></a>
      <a href="panier.html" class="relative">Panier <span id="cart-count" class="ml-1 bg-red-600 text-white rounded-full text-xs px-2">0</span></a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Votre panier</h1>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-white p-4 rounded" id="cart-items">
        <!-- items injected here -->
      </div>
      <aside class="bg-white p-4 rounded">
        <h2 class="font-semibold">Récapitulatif</h2>
        <div class="mt-3">
          <div class="flex justify-between"><span>Sous-total</span><span id="summary-sub">$0.00</span></div>
          <div class="flex justify-between"><span>Livraison</span><span id="summary-shipping">$0.00</span></div>
          <div class="flex justify-between font-bold mt-2"><span>Total</span><span id="summary-total">$0.00</span></div>
        </div>
        <div class="mt-4">
          <button id="btn-clear" class="w-full bg-gray-200 py-2 rounded mb-2">Vider le panier</button>
          <button id="btn-pay" class="w-full bg-green-600 text-white py-2 rounded">Payer via WhatsApp</button>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-white mt-12 py-6"><div class="container mx-auto px-4 text-sm text-gray-600">© Couturo</div></footer>

  <script src="js/cart.js"></script>
  <script>
    function renderCartPage(){
      const root = document.getElementById('cart-items');
      const items = Cart.all();
      if(items.length===0){ root.innerHTML = '<div class="p-6 text-center">Votre panier est vide</div>'; updateSummary(); return; }
      root.innerHTML = '';
      items.forEach(i=>{
        const row = document.createElement('div'); row.className = 'flex items-center gap-4 border-b py-3';
        const img = document.createElement('img'); img.src = i.image || 'images/logo.jpg'; img.className = 'w-20 h-20 object-cover';
        const body = document.createElement('div'); body.className = 'flex-1';
        const title = document.createElement('div'); title.className = 'font-semibold'; title.textContent = i.name;
        const priceInfo = document.createElement('div'); priceInfo.className='text-sm text-gray-600'; priceInfo.textContent = 'Prix: $' + i.price.toFixed(2);
        const controls = document.createElement('div'); controls.className = 'mt-2 flex items-center gap-2';
        const btnDec = document.createElement('button'); btnDec.className='dec px-2 py-1 bg-gray-200'; btnDec.dataset.id = i.id; btnDec.textContent='-';
        const qtySpan = document.createElement('span'); qtySpan.id = 'qty-' + i.id; qtySpan.textContent = i.qty;
        const btnInc = document.createElement('button'); btnInc.className='inc px-2 py-1 bg-gray-200'; btnInc.dataset.id = i.id; btnInc.textContent='+';
        const btnDel = document.createElement('button'); btnDel.className='ml-4 text-sm text-red-600 del'; btnDel.dataset.id = i.id; btnDel.textContent='Supprimer';
        controls.appendChild(btnDec); controls.appendChild(qtySpan); controls.appendChild(btnInc); controls.appendChild(btnDel);
        body.appendChild(title); body.appendChild(priceInfo); body.appendChild(controls);
        const total = document.createElement('div'); total.className='font-semibold'; total.textContent = '$' + (i.price*i.qty).toFixed(2);
        row.appendChild(img); row.appendChild(body); row.appendChild(total);
        root.appendChild(row);
      });
      document.querySelectorAll('.inc').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.id; const cur = Cart.all().find(x=>x.id===id); Cart.update(id, cur.qty+1); renderCartPage(); }));
      document.querySelectorAll('.dec').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.id; const cur = Cart.all().find(x=>x.id===id); Cart.update(id, cur.qty-1); renderCartPage(); }));
      document.querySelectorAll('.del').forEach(b=>b.addEventListener('click', ()=>{ Cart.remove(b.dataset.id); renderCartPage(); }));
      updateSummary();
    }
    function updateSummary(){ document.getElementById('summary-sub').textContent = '$'+Cart.subtotal().toFixed(2); document.getElementById('summary-shipping').textContent = '$'+Cart.shipping().toFixed(2); document.getElementById('summary-total').textContent = '$'+Cart.total().toFixed(2); document.getElementById('cart-count').textContent = Cart.all().reduce((s,i)=>s+i.qty,0); }
    document.addEventListener('DOMContentLoaded', ()=>{ renderCartPage(); document.getElementById('btn-clear').addEventListener('click', ()=>{ if(confirm('Vider le panier ?')){ Cart.clear(); renderCartPage(); } }); document.getElementById('btn-pay').addEventListener('click', sendCartToWhatsapp); });
  </script>
</body>
</html>
