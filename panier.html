<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panier - Couturo Business</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1FQZL4l9gqQ8K/uxQe1YkzU6qVQ5KkNf5Q5n9JVo5F8" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-3 d-flex align-items-center justify-content-between">
      <a href="index.html" class="d-flex align-items-center gap-2"><img src="images/logo.jpg" alt="Couturo Business" class="h-12"><span class="brand-title ms-2">Couturo Business</span></a>
      <div>
        <a href="panier.html" class="btn btn-outline-secondary btn-sm position-relative">Panier <span id="cart-count" class="badge bg-danger ms-2">0</span></a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Votre panier</h1>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-white p-4 rounded" id="cart-items">
        <!-- items injected here -->
      </div>
      <aside class="bg-white p-4 rounded">
        <h2 class="font-semibold">Récapitulatif</h2>
        <div class="mt-3">
          <div class="flex justify-between"><span>Sous-total</span><span id="summary-sub">0 CDF</span></div>
          <div class="flex justify-between"><span>Livraison</span><span id="summary-shipping">0 CDF</span></div>
          <div class="flex justify-between font-bold mt-2"><span>Total</span><span id="summary-total">0 CDF</span></div>
        </div>
        <div class="mt-4">
          <button id="btn-clear" class="w-full bg-gray-200 py-2 rounded mb-2">Vider le panier</button>
          <button id="btn-pay" class="w-full bg-green-600 text-white py-2 rounded">Payer via WhatsApp</button>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-white mt-12 py-6 border-top">
    <div class="container mx-auto px-4 text-sm text-gray-600">
      <div class="row">
        <div class="col-md-6">© Couturo</div>
        <div class="col-md-6 text-md-end"><a href="contact.html">Contact</a> • <a href="#">Mentions légales</a></div>
      </div>
    </div>
  </footer>

  <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:10800"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-qQ2rWq6mK8Q+YkG6+7gGQZsI5Y5b1K9f6Y9j6Z8s1V9j6k7G6q1b2c3d4e5f6g7h" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCartPage(){
      const root = document.getElementById('cart-items');
      const items = Cart.all();
      if(items.length===0){ root.innerHTML = '<div class="p-6 text-center">Votre panier est vide</div>'; updateSummary(); return; }
      root.innerHTML = '';
      items.forEach(i=>{
        const row = document.createElement('div'); row.className = 'flex items-center gap-4 border-b py-3';
        const img = document.createElement('img'); img.src = i.image || 'images/logo.jpg'; img.className = 'w-20 h-20 object-cover';
        const body = document.createElement('div'); body.className = 'flex-1';
        const title = document.createElement('div'); title.className = 'font-semibold'; title.textContent = i.name;
        const priceInfo = document.createElement('div'); priceInfo.className='text-sm text-muted'; priceInfo.textContent = 'Prix: ' + (typeof formatPrice === 'function' ? formatPrice(i.price) : ('$'+i.price.toFixed(2)));
        const controls = document.createElement('div'); controls.className = 'mt-2 flex items-center gap-2';
        const btnDec = document.createElement('button'); btnDec.className='dec px-2 py-1 bg-gray-200'; btnDec.dataset.id = i.id; btnDec.textContent='-';
        const qtySpan = document.createElement('span'); qtySpan.id = 'qty-' + i.id; qtySpan.textContent = i.qty;
        const btnInc = document.createElement('button'); btnInc.className='inc px-2 py-1 bg-gray-200'; btnInc.dataset.id = i.id; btnInc.textContent='+';
        const btnDel = document.createElement('button'); btnDel.className='ml-4 text-sm text-red-600 del'; btnDel.dataset.id = i.id; btnDel.textContent='Supprimer';
        controls.appendChild(btnDec); controls.appendChild(qtySpan); controls.appendChild(btnInc); controls.appendChild(btnDel);
        body.appendChild(title); body.appendChild(priceInfo); body.appendChild(controls);
        const total = document.createElement('div'); total.className='font-semibold'; total.textContent = (typeof formatPrice === 'function' ? formatPrice(i.price*i.qty) : ('$'+(i.price*i.qty).toFixed(2)));
        row.appendChild(img); row.appendChild(body); row.appendChild(total);
        root.appendChild(row);
      });
      document.querySelectorAll('.inc').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.id; const cur = Cart.all().find(x=>x.id===id); Cart.update(id, cur.qty+1); renderCartPage(); }));
      document.querySelectorAll('.dec').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.id; const cur = Cart.all().find(x=>x.id===id); Cart.update(id, cur.qty-1); renderCartPage(); }));
      document.querySelectorAll('.del').forEach(b=>b.addEventListener('click', ()=>{ Cart.remove(b.dataset.id); renderCartPage(); }));
      updateSummary();
    }
    function updateSummary(){ document.getElementById('summary-sub').textContent = (typeof formatPrice === 'function' ? formatPrice(Cart.subtotal()) : ('$'+Cart.subtotal().toFixed(2))); document.getElementById('summary-shipping').textContent = (typeof formatPrice === 'function' ? formatPrice(Cart.shipping()) : ('$'+Cart.shipping().toFixed(2))); document.getElementById('summary-total').textContent = (typeof formatPrice === 'function' ? formatPrice(Cart.total()) : ('$'+Cart.total().toFixed(2))); document.getElementById('cart-count').textContent = Cart.all().reduce((s,i)=>s+i.qty,0); }
    document.addEventListener('DOMContentLoaded', ()=>{ renderCartPage(); document.getElementById('btn-clear').addEventListener('click', ()=>{ if(confirm('Vider le panier ?')){ Cart.clear(); renderCartPage(); } }); document.getElementById('btn-pay').addEventListener('click', sendCartToWhatsapp); });
  </script>
</body>
</html>
