<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boutique - Couturo Business</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1FQZL4l9gqQ8K/uxQe1YkzU6qVQ5KkNf5Q5n9JVo5F8" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-3 d-flex align-items-center justify-content-between">
      <a href="index.html" class="d-flex align-items-center gap-2"><img src="images/logo.jpg" alt="Couturo Business" class="h-12"><span class="brand-title ms-2">Couturo Business</span></a>
      <div class="d-flex align-items-center gap-3">
        <div class="position-relative">
          <input id="search-input" type="search" placeholder="Rechercher..." class="form-control form-control-sm" style="min-width:240px">
          <div id="search-results" class="position-absolute bg-white shadow rounded mt-1" style="right:0;z-index:1080"></div>
        </div>
        <a href="panier.html" class="btn btn-outline-secondary btn-sm ms-2 position-relative">Panier <span id="cart-count" class="badge bg-danger ms-2">0</span></a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Boutique</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="shop-list"></div>
  </main>

  <footer class="bg-white mt-12 py-6 border-top">
    <div class="container mx-auto px-4 text-sm text-gray-600">
      <div class="row">
        <div class="col-md-6">© Couturo</div>
        <div class="col-md-6 text-md-end"><a href="contact.html">Contact</a> • <a href="#">Mentions légales</a></div>
      </div>
    </div>
  </footer>

  <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:10800"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-qQ2rWq6mK8Q+YkG6+7gGQZsI5Y5b1K9f6Y9j6Z8s1V9j6k7G6q1b2c3d4e5f6g7h" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script src="data/products.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      renderProductsList('#shop-list', window.PRODUCTS);
      Cart.renderCartCount();
    });
  </script>
</body>
</html>
