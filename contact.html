<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact - Couturo Business</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1FQZL4l9gqQ8K/uxQe1YkzU6qVQ5KkNf5Q5n9JVo5F8" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-3 d-flex align-items-center justify-content-between">
      <a href="index.html" class="d-flex align-items-center gap-2"><img src="images/logo.jpg" alt="Couturo Business" class="h-12"><span class="brand-title ms-2">Couturo Business</span></a>
      <div>
        <a href="panier.html" class="btn btn-outline-secondary btn-sm position-relative">Panier <span id="cart-count" class="badge bg-danger ms-2">0</span></a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4">Contactez-nous</h1>
    <div class="bg-white p-6 rounded">
      <p>Assistance WhatsApp: <a class="text-indigo-600" href="https://wa.me/243977000858">+243977000858</a></p>
      <form id="contact-form" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
        <input placeholder="Nom" class="border p-2 rounded" required>
        <input placeholder="Email" class="border p-2 rounded" required>
        <input placeholder="Sujet" class="border p-2 rounded col-span-2" required>
        <textarea placeholder="Message" class="border p-2 rounded col-span-2" rows="6" required></textarea>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded col-span-2">Envoyer</button>
      </form>
    </div>
  </main>

  <footer class="bg-white mt-12 py-6 border-top">
    <div class="container mx-auto px-4 text-sm text-gray-600">
      <div class="row">
        <div class="col-md-6">© Couturo</div>
        <div class="col-md-6 text-md-end"><a href="contact.html">Contact</a> • <a href="#">Mentions légales</a></div>
      </div>
    </div>
  </footer>

  <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:10800"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-qQ2rWq6mK8Q+YkG6+7gGQZsI5Y5b1K9f6Y9j6Z8s1V9j6k7G6q1b2c3d4e5f6g7h" crossorigin="anonymous"></script>
  <script src="js/cart.js"></script>
  <script>document.addEventListener('DOMContentLoaded', ()=>Cart.renderCartCount());</script>
</body>
</html>
